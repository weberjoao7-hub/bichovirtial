<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292c43"><title>Bicho Virtual — Pocket Pet</title>
<style>
:root{--ink:#283044;--soft:#696e82;--pink:#ed7993;--cream:#fff9ec;--shell:#f4b6ad;--lcd:#c7ddad;--dark:#475c45}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#f9e7d7,#aebed1);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Trebuchet MS,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #365ca9;outline-offset:3px}
.layout{width:min(100%,455px);display:grid;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;padding:0 12px}.top strong{letter-spacing:2px;font-size:13px}.top span{font-size:12px}
.console{border:5px solid #d68e93;border-radius:43% 43% 39% 39% / 29% 29% 42% 42%;padding:30px 28px 37px;background:linear-gradient(125deg,#ffd9c5,#f39aa9 54%,#d881a1);box-shadow:inset 5px 6px 0 #ffffff6e,inset -7px -8px 0 #ad587b70,0 19px 0 #8d66786e,0 29px 45px #26345235;position:relative}
.console:before{content:"POCKET FRIEND";position:absolute;top:15px;left:0;right:0;text-align:center;font-size:10px;font-weight:900;letter-spacing:4px;color:#84385f}
.bezel{margin-top:10px;background:#5d6171;border:8px solid #5e6373;border-radius:25px;padding:9px;box-shadow:inset 0 3px 10px #2d3440,0 4px 3px #b66d83}
.screen{background:var(--lcd);height:310px;border-radius:11px;position:relative;overflow:hidden;box-shadow:inset 0 0 30px #7d9b75;image-rendering:pixelated}
.screen:after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,#223b1511 0 1px,transparent 1px 5px);opacity:.45}
.screen-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:700 12px monospace;color:#4b654c}
.scene{height:218px;position:relative;overflow:hidden;background:linear-gradient(#cde3b9 0 76%,#adc69b 76%);border-top:2px solid #9db58b;border-bottom:2px solid #9db58b}
.cloud{position:absolute;font-size:25px;opacity:.45;animation:drift 7s ease-in-out infinite alternate}.cloud.a{top:10px;left:14px}.cloud.b{top:34px;right:20px;animation-delay:-3s}
.floor{position:absolute;bottom:19px;left:20%;width:60%;height:15px;border-radius:50%;background:#7c977b55}
#pet{display:block;position:absolute;left:50%;top:50%;width:152px;height:152px;transform:translate(-50%,-43%);image-rendering:pixelated;filter:drop-shadow(2px 5px 0 #819b7f55);animation:bob 1.9s ease-in-out infinite;cursor:pointer}
#pet.sleep{animation:sleep 2s ease-in-out infinite}#pet.hop{animation:hop .45s ease-in-out 2}#pet.sick{filter:grayscale(.65)}
.effect{position:absolute;left:50%;top:20%;font-size:24px;pointer-events:none;animation:float 1s ease-out forwards}
.object{position:absolute;bottom:15px;font-size:26px;animation:bob 2s ease-in-out infinite}
.screen-bottom{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;font:700 11px monospace;color:#486145}.tiny-pill{border:2px solid #819c79;border-radius:12px;padding:2px 7px}
.nameplate{text-align:center;margin:12px 0 14px;font-weight:900;letter-spacing:2px;font-size:15px;color:#73385d;text-shadow:0 1px #fff7}
.hardware{display:flex;justify-content:space-evenly;align-items:center}.hardbtn{width:60px;height:46px;border-radius:50%;border:4px solid #ce708b;background:linear-gradient(#fff6ee,#ffb9b3);box-shadow:0 5px 0 #a55d80,inset 0 3px 0 #fff;font-size:20px;color:#873e65}.hardbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #a55d80}
.dashboard{background:#fffdf5e9;border-radius:24px;padding:17px;box-shadow:0 9px 25px #3e425025}
.identity{display:flex;justify-content:space-between;align-items:center;gap:10px}.identity h1{font-size:20px;margin:0}.identity p{margin:3px 0 0;color:var(--soft);font-size:12px}.tag{background:#ffe5e5;border-radius:15px;padding:7px 10px;font-size:11px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat{background:#f2eee4;padding:9px;border-radius:13px}.stat label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:6px}.track{height:9px;border-radius:10px;background:#d6d5c8;overflow:hidden}.fill{width:70%;height:100%;border-radius:10px;background:#73b790;transition:width .4s}.fill.low{background:#ed9c77}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{background:#fff;border:2px solid #e9dfd8;border-radius:15px;padding:10px 4px;font-size:11px;font-weight:800;min-height:72px}.action i{display:block;font-style:normal;font-size:25px;margin-bottom:5px}.action:active{transform:scale(.96);background:#fff0e7}
.message{min-height:39px;margin-top:12px;background:#f8efde;border-radius:13px;padding:11px;text-align:center;font-size:12px;font-weight:700;color:#72546a}
.footer{display:flex;justify-content:space-between;font-size:11px;padding:0 8px;color:#344358}.footer button{color:#344358;border:0;background:transparent;text-decoration:underline;padding:0}
.overlay{position:fixed;inset:0;background:#232b3cbc;z-index:10;display:flex;align-items:center;justify-content:center;padding:17px}.modal{background:#fffaf2;border:5px solid #edacb5;border-radius:25px;padding:23px;max-width:380px;width:100%;text-align:center;box-shadow:0 16px 50px #0004}.modal h2{margin:3px 0 12px}.modal p{line-height:1.5;font-size:14px}.modal input{width:100%;border:2px solid #ddb4ab;border-radius:11px;padding:12px;font:inherit;text-align:center}.primary{margin-top:12px;background:#d96f92;color:white;border:0;border-radius:14px;padding:13px 20px;font-weight:900;width:100%}.choices{display:flex;gap:9px;margin-top:12px}.choices button{flex:1;background:#e6efd8;border:2px solid #9aac8f;border-radius:13px;padding:12px;font-size:27px}.choices button.selected{border-color:#b34d74;background:#f9c7c3}
.hidden{display:none!important}.help{font-size:12px!important;color:#656477}
@keyframes bob{50%{transform:translate(-50%,-47%)}}@keyframes hop{40%{transform:translate(-50%,-66%)}}@keyframes sleep{50%{transform:translate(-50%,-40%) rotate(-3deg)}}@keyframes float{to{opacity:0;transform:translateY(-65px)}}@keyframes drift{to{transform:translateX(22px)}}
@media(max-width:370px){body{padding:9px}.console{padding:28px 20px 32px}.screen{height:275px}.scene{height:185px}.hardbtn{width:52px;height:42px}.actions{gap:5px}}
</style>
</head>
<body>
<main class="layout">
<header class="top"><strong>✦ BICHO VIRTUAL ✦</strong><span id="clock"></span></header>
<section class="console" aria-label="Console de bichinho virtual">
<div class="bezel"><div class="screen">
<div class="screen-head"><span id="dayLabel">DIA 1</span><span id="weather">☀ ENSOLARADO</span></div>
<div class="scene" id="scene"><span class="cloud a">☁</span><span class="cloud b">☁</span><div class="floor"></div><canvas id="pet" width="64" height="64" aria-label="Seu bichinho"></canvas></div>
<div class="screen-bottom"><span id="status">♥ FELIZ</span><span class="tiny-pill" id="life">BEBÊ</span><span id="coins">★ 15</span></div>
</div></div>
<div class="nameplate">♡ LOVE YOUR LITTLE FRIEND ♡</div>
<div class="hardware"><button class="hardbtn" id="prev" aria-label="Ação anterior">◀</button><button class="hardbtn" id="select" aria-label="Selecionar ação">●</button><button class="hardbtn" id="next" aria-label="Próxima ação">▶</button></div>
</section>
<section class="dashboard">
<div class="identity"><div><h1 id="petName">Meu bichinho</h1><p id="petMeta">Seu novo melhor amigo</p></div><span class="tag" id="mood">😊 CONTENTE</span></div>
<div class="stats" id="stats"></div>
<div class="actions" id="actions">
<button class="action" data-act="feed"><i>🍎</i>Alimentar</button><button class="action" data-act="play"><i>🎾</i>Brincar</button><button class="action" data-act="sleep"><i>🌙</i>Dormir</button><button class="action" data-act="clean"><i>🧼</i>Banho</button><button class="action" data-act="heal"><i>💊</i>Cuidar</button><button class="action" data-act="game"><i>🎮</i>Minijogo</button>
</div><div id="message" class="message" role="status">Seu bichinho está esperando carinho!</div>
</section>
<footer class="footer"><span>Salvo automaticamente neste aparelho</span><button id="helpBtn">Como jogar</button><button id="resetBtn">Recomeçar</button></footer>
</main>
<div class="overlay hidden" id="overlay"><section class="modal" id="modal" aria-live="polite"></section></div>
<script>
(()=>{'use strict';
const KEY='bichovirtual_save_v1',TICK=18000,MAX=100;
const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(MAX,n));
const species={cat:{symbol:'🐱',label:'Gatinho',color:'#f0a66b',ear:true},bunny:{symbol:'🐰',label:'Coelhinho',color:'#e9d8ca',ear:true},bear:{symbol:'🐻',label:'Ursinho',color:'#bf9c75',ear:false}};
let pet=null,selected='cat',actionIndex=0,timer=null;
const actions=['feed','play','sleep','clean','heal','game'];
function message(s){$('message').textContent=s}
function save(){if(pet)localStorage.setItem(KEY,JSON.stringify(pet))}
function initial(name,type){return{name:name||'Pipoca',type,born:Date.now(),updated:Date.now(),hunger:78,joy:85,energy:86,clean:90,health:100,coins:15,asleep:false,poops:0,plays:0,stage:0,dead:false}}
function age(){return Math.floor((Date.now()-pet.born)/60000)}
function stage(){return age()<3?'BEBÊ':age()<12?'CRIANÇA':'ADULTO'}
function updateTime(){if(!pet||pet.dead)return;let now=Date.now(),steps=Math.min(1440,Math.floor((now-pet.updated)/TICK));if(steps<=0)return;pet.updated+=steps*TICK;pet.hunger=clamp(pet.hunger-steps*.8);pet.clean=clamp(pet.clean-steps*.45);pet.energy=clamp(pet.energy+(pet.asleep?steps*2.8:-steps*.55));pet.joy=clamp(pet.joy-steps*.5);if(pet.hunger<20||pet.clean<18||pet.energy<12)pet.health=clamp(pet.health-steps*.5);else if(pet.health<100)pet.health=clamp(pet.health+steps*.13);pet.poops=Math.min(4,pet.poops+Math.floor(steps/35));if(pet.asleep&&pet.energy>=99){pet.asleep=false;message('Seu amigo acordou descansado!')}if(pet.health<=0){pet.dead=true;pet.asleep=false;message('Seu bichinho precisa de um novo começo 💔')}save()}
function draw(){if(!pet)return;const c=$('pet'),ctx=c.getContext('2d');ctx.clearRect(0,0,64,64);ctx.imageSmoothingEnabled=false;
const S=species[pet.type]||species.cat,adult=stage()==='ADULTO',baby=stage()==='BEBÊ';
const rect=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,w,h)};
const outline='#52634b',body=S.color;
if(pet.dead){rect(17,48,30,3,'#6f8869');rect(21,45,5,3,out);return}
if(S.ear){if(pet.type==='bunny'){rect(18,3,10,25,outline);rect(36,3,10,25,outline);rect(20,5,6,21,'#e5aabb');rect(38,5,6,21,'#e5aabb')}else{rect(13,13,14,19,outline);rect(37,13,14,19,outline);rect(16,16,8,12,'#d78385');rect(40,16,8,12,'#d78385')}}else{rect(12,17,13,13,outline);rect(39,17,13,13,outline);rect(15,19,8,9,body);rect(41,19,8,9,body)}
rect(15,24,34,30,outline);rect(18,21,28,31,body);rect(13,31,38,19,body);rect(17,49,30,6,outline);rect(20,48,24,5,body);rect(17,51,9,6,outline);rect(38,51,9,6,outline);
if(adult){rect(17,26,30,1,'#ffffff55')}if(baby){rect(24,42,16,10,'#fff6db')}
if(pet.asleep){rect(21,37,8,2,outline);rect(36,37,8,2,outline);rect(30,43,4,2,out)}else if(pet.health<28){rect(22,36,6,2,out);rect(37,36,6,2,out);rect(30,44,4,2,out)}else{rect(22,35,7,8,out);rect(37,35,7,8,out);rect(24,36,2,3,'#fff');rect(39,36,2,3,'#fff');rect(30,44,4,3,'#ba7881');if(pet.joy>35){rect(28,48,8,2,out)}else{rect(29,49,6,2,out)}}
rect(17,44,5,3,'#eb979b');rect(43,44,5,3,'#eb979b');if(pet.clean<25){rect(13,41,4,3,'#829b60');rect(47,47,4,3,'#829b60')}
}
function render(){if(!pet)return;const fields=[['🍎 Saciedade','hunger'],['😊 Felicidade','joy'],['⚡ Energia','energy'],['🧼 Higiene','clean'],['❤️ Saúde','health']];$('stats').innerHTML=fields.map(([t,k])=>'<div class="stat"><label><span>'+t+'</span><span>'+Math.round(pet[k])+'%</span></label><div class="track"><div class="fill '+(pet[k]<30?'low':'')+'" style="width:'+pet[k]+'%"></div></div></div>').join('')+'<div class="stat"><label><span>🪙 Moedas</span><span>'+pet.coins+'</span></label><div class="track"><div class="fill" style="width:'+Math.min(100,pet.coins)+'%"></div></div></div>';
$('petName').textContent=pet.name;$('petMeta').textContent=species[pet.type].label+' • '+age()+' min de vida';$('dayLabel').textContent='DIA '+(1+Math.floor(age()/12));$('life').textContent=stage();$('coins').textContent='★ '+pet.coins;
let mood=pet.dead?'💔 ADEUS':pet.asleep?'💤 DORMINDO':pet.health<25?'🤒 DOENTE':pet.hunger<25?'🍽 COM FOME':pet.clean<25?'🧼 SUJINHO':pet.joy<25?'😢 TRISTE':'😊 CONTENTE';$('mood').textContent=mood;$('status').textContent=mood; $('pet').classList.toggle('sleep',pet.asleep);$('pet').classList.toggle('sick',pet.health<30);
$('weather').textContent=new Date().getHours()>18||new Date().getHours()<6?'☾ NOITE':'☀ DIA';
$('actions').querySelectorAll('button').forEach((el,i)=>{el.style.borderColor=i===actionIndex?'#d87592':'#e9dfd8';el.disabled=pet.dead});draw();
}
function sparkle(e){let node=document.createElement('span');node.className='effect';node.textContent=e;$('scene').appendChild(node);setTimeout(()=>node.remove(),1100)}
function act(type){if(!pet||pet.dead)return;updateTime();if(type==='game'){minigame();return}
if(type==='feed'){pet.hunger=clamp(pet.hunger+27);pet.clean=clamp(pet.clean-5);sparkle('🍎');message(pet.name+' comeu tudo! Que delícia!')}
if(type==='play'){if(pet.energy<10){message('Está muito cansado para brincar.');return}pet.joy=clamp(pet.joy+23);pet.energy=clamp(pet.energy-12);pet.hunger=clamp(pet.hunger-6);pet.plays++;sparkle('💗');$('pet').classList.add('hop');setTimeout(()=>$('pet').classList.remove('hop'),950);message(pet.name+' adorou brincar com você!')}
if(type==='sleep'){pet.asleep=!pet.asleep;if(pet.asleep){sparkle('💤');message('Boa noite! A energia se recupera com o tempo.')}else message('Bom dia! '+pet.name+' acordou!')}
if(type==='clean'){pet.clean=clamp(pet.clean+42);pet.poops=0;sparkle('🫧');message('Banho tomado! Cheirinho de limpeza!')}
if(type==='heal'){if(pet.coins<4){message('São necessárias 4 moedas para o remédio.');return}pet.coins-=4;pet.health=clamp(pet.health+35);sparkle('❤️');message('Cuidado recebido! A saúde melhorou.')}
save();render()}
function minigame(){open('<h2>🎲 Adivinhe o presente!</h2><p>Escolha uma das caixas. Você pode ganhar até 8 moedas!</p><div class="choices"><button data-guess="0">🎁</button><button data-guess="1">🎁</button><button data-guess="2">🎁</button></div><p class="help">Brinque para ganhar moedas e cuidar do seu amigo.</p>');const winner=Math.floor(Math.random()*3);document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{let won=Number(b.dataset.guess)===winner;pet.coins+=won?8:2;pet.joy=clamp(pet.joy+10);save();close();sparkle(won?'🌟':'💗');message(won?'Acertou! +8 moedas!':'Quase! +2 moedas pela tentativa.');render()})}
function open(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}
function close(){$('overlay').classList.add('hidden')}
function welcome(){open('<h2>🥚 Um novo amigo!</h2><p>Escolha seu bichinho, dê um nome e cuide dele todos os dias. Ele cresce com o tempo!</p><div class="choices" id="types">'+Object.entries(species).map(([k,v])=>'<button data-type="'+k+'" class="'+(k===selected?'selected':'')+'" title="'+v.label+'">'+v.symbol+'</button>').join('')+'</div><p><input id="nickname" maxlength="18" placeholder="Nome do bichinho" value="Pipoca" aria-label="Nome do bichinho"></p><button class="primary" id="begin">ADOTAR MEU BICHINHO ♥</button>');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('selected',x===b))});$('begin').onclick=()=>{pet=initial($('nickname').value.trim().slice(0,18),selected);save();close();message('Bem-vindo! Alimente, brinque e cuide do seu novo amigo.');render()}}
function help(){open('<h2>📖 Como jogar</h2><p>Cuide do seu bichinho com os seis botões. Alimente quando estiver com fome, brinque para aumentar a felicidade, dê banho e deixe dormir para recuperar energia.</p><p>O tempo passa automaticamente, mesmo com o jogo fechado. O bichinho cresce de bebê para criança e depois adulto. No minijogo, ganhe moedas para comprar remédios.</p><p class="help">Os botões da console ◀ ● ▶ selecionam e executam as ações. O progresso fica salvo neste navegador.</p><button class="primary" id="ok">ENTENDI!</button>');$('ok').onclick=close}
function reset(){open('<h2>Recomeçar aventura?</h2><p>Isso apaga o bichinho atual e todo o progresso salvo neste navegador.</p><button class="primary" id="yes">SIM, RECOMEÇAR</button><button class="primary" style="background:#8c91a4" id="no">CANCELAR</button>');$('yes').onclick=()=>{localStorage.removeItem(KEY);pet=null;welcome()};$('no').onclick=close}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&species[saved.type]&&typeof saved.born==='number'){pet={...initial(saved.name,saved.type),...saved};updateTime()}}catch(e){console.warn('Save inválido',e)}
$('actions').addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(btn){actionIndex=actions.indexOf(btn.dataset.act);act(btn.dataset.act)}});
$('prev').onclick=()=>{actionIndex=(actionIndex+5)%6;render();message('Selecionado: '+$('actions').children[actionIndex].innerText)};
$('next').onclick=()=>{actionIndex=(actionIndex+1)%6;render();message('Selecionado: '+$('actions').children[actionIndex].innerText)};
$('select').onclick=()=>act(actions[actionIndex]);$('pet').onclick=()=>act('play');$('helpBtn').onclick=help;$('resetBtn').onclick=reset;
function heartbeat(){let now=new Date();$('clock').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(pet){updateTime();render()}}
heartbeat();if(!pet)welcome();timer=setInterval(heartbeat,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)heartbeat()});
})();
</script></body></html>
