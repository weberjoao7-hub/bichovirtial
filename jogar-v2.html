!important}.hero-pet.reaction-wash,.hero-pet.reaction-heal{animation:hero-wash .4s ease-in-out 3!important}.hero-pet img{user-select:none;-webkit-user-drag:none}.scene-prop{transition:opacity .2s ease}/* v2.6: real 144px transparent pixel art; all species now share a sharp rendering path. */

<body>
<main class="layout">
<header class="top"><strong>✦ BICHO VIRTUAL <span class="version-stamp">V2.6</span> ✦</strong><span id="clock"></span></header>
<section class="console" aria-label="Console de bichinho virtual">
<div class="bezel"><div class="screen">
<div class="screen-head"><span id="dayLabel">DIA 1</span><span id="weather">☀ ENSOLARADO</span></div>
<div class="scene" id="scene"><span class="cloud a">✿</span><span class="cloud b">✦</span><div class="floor"></div><div id="petShadow" class="pet-shadow"></div><div id="sceneProp" class="scene-prop"></div><span id="heroPet" class="hero-pet" aria-label="Seu bichinho" role="img">🥚</span><canvas id="pet" width="64" height="64" aria-label="Desenho alternativo" style="display:none"></canvas></div>
<div class="screen-bottom"><span id="status">♥ FELIZ</span><span class="tiny-pill" id="life">BEBÊ</span><span id="coins">★ 15</span></div>
</div></div>
<div class="nameplate">♡ LOVE YOUR LITTLE FRIEND ♡</div>
<div class="hardware"><button class="hardbtn" id="prev" aria-label="Ação anterior">◀</button><button class="hardbtn" id="select" aria-label="Selecionar ação">●</button><button class="hardbtn" id="next" aria-label="Próxima ação">▶</button></div>
</section>
<section class="dashboard">
<div class="identity"><div><h1 id="petName">Meu bichinho</h1><p id="petMeta">Seu novo melhor amigo</p></div><span class="tag" id="mood">😊 CONTENTE</span></div>
<div class="stats" id="stats"></div>
<div class="actions" id="actions">
<button class="action" data-act="feed"><i>🍎</i>Alimentar</button><button class="action" data-act="play"><i>🎾</i>Brincar</button><button class="action" data-act="sleep"><i>🌙</i>Dormir</button><button class="action" data-act="clean"><i>🧼</i>Banho</button><button class="action" data-act="heal"><i>💊</i>Cuidar</button><button class="action" data-act="game"><i>🎮</i>Minijogo</button>
</div><div id="message" class="message" role="status">Seu bichinho está esperando carinho!</div>
</section>
<footer class="footer"><span>Salvo automaticamente neste aparelho</span><button id="soundBtn" aria-label="Alternar som">🔊 Som</button><button id="achBtn">Conquistas</button><button id="helpBtn">Como jogar</button><button id="resetBtn">Recomeçar</button></footer>
</main>
<div class="overlay hidden" id="overlay"><section class="modal" id="modal" aria-live="polite"></section></div>
<script>
(()=>{'use strict';
const KEY='bichovirtual_save_v1',TICK=300000,MAX=100;
const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(MAX,n));
const species={cat:{symbol:'🐱',label:'Gatinho',color:'#f0a66b',ear:true},bunny:{symbol:'🐰',label:'Coelhinho',color:'#e9d8ca',ear:true},bear:{symbol:'🐻',label:'Ursinho',color:'#bf9c75',ear:false}};
let pet=null,selected='cat',actionIndex=0,timer=null,animationFrame=0,animUntil=0,lastIdle=0,soundOn=localStorage.getItem('bichovirtual_sound')!=='off',audioCtx=null;const foods=[{name:'Maçã',emoji:'🍎',cost:0,full:16,joy:2},{name:'Ração',emoji:'🥣',cost:2,full:32,joy:0},{name:'Bolo',emoji:'🍰',cost:5,full:22,joy:18},{name:'Banquete',emoji:'🍱',cost:9,full:52,joy:12}];const awards=[{id:'start',label:'🥚 Primeira amizade',ok:p=>!!p.born},{id:'plays',label:'🎾 Companheiro de brincadeiras',ok:p=>p.plays>=10},{id:'child',label:'🌱 Crescer é uma aventura',ok:p=>age()>=3},{id:'adult',label:'⭐ Amigo para toda vida',ok:p=>age()>=12},{id:'rich',label:'🪙 Colecionador',ok:p=>p.coins>=50},{id:'clean',label:'🫧 Dia de spa',ok:p=>p.baths>=5}];
const actions=['feed','play','sleep','clean','heal','game'];
function message(s){$('message').textContent=s}function beep(freq=600,duration=.09){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function save(){if(pet)localStorage.setItem(KEY,JSON.stringify({...pet,animation:''}))}
function initial(name,type){return{name:name||'Pipoca',type,born:Date.now(),updated:Date.now(),hunger:78,joy:85,energy:86,clean:90,health:100,coins:15,asleep:false,poops:0,plays:0,baths:0,stage:0,phaseVersion:2,dead:false}}
function age(){return Math.floor((Date.now()-pet.born)/60000)}
function stage(){const t=(Date.now()-pet.born)/60000;if(pet.phaseVersion!==2)return t<3?'BEBÊ':t<12?'JOVEM':'ADULTO';return t<2?'OVO':t<4?'CHOCANDO':t<12?'BEBÊ':t<25?'JOVEM':'ADULTO'}
function eggStage(){return stage()==='OVO'||stage()==='CHOCANDO'}
function evolve(){if(!pet||pet.dead)return;const phase=stage();if(!pet.lastPhase){pet.lastPhase=phase;save();return}if(phase===pet.lastPhase)return;pet.lastPhase=phase;if(phase==='CHOCANDO'){message('🥚 O ovo começou a rachar!');sparkle('✨');beep(750,.12)}else if(phase==='BEBÊ'){message('🎉 NASCEU! '+pet.name+' saiu do ovo!');sparkle('🌟');beep(900,.23)}else if(phase==='JOVEM'){message('🌱 '+pet.name+' cresceu! Já é jovem!');sparkle('⭐');beep(860,.2)}else if(phase==='ADULTO'){message('👑 '+pet.name+' virou adulto!');sparkle('👑');beep(980,.25)}save()}
function updateTime(){if(!pet||pet.dead)return;let now=Date.now(),steps=Math.min(288,Math.floor((now-pet.updated)/TICK));if(steps<=0)return;pet.updated=now;pet.hunger=clamp(pet.hunger-steps*.8);pet.clean=clamp(pet.clean-steps*.45);pet.energy=clamp(pet.energy+(pet.asleep?steps*2.8:-steps*.55));pet.joy=clamp(pet.joy-steps*.5);if(pet.hunger<20||pet.clean<18||pet.energy<12)pet.health=clamp(pet.health-steps*.18);else if(pet.health<100)pet.health=clamp(pet.health+steps*.1);pet.poopCounter=(pet.poopCounter||0)+steps;while(pet.poopCounter>=35){pet.poopCounter-=35;pet.poops=Math.min(4,pet.poops+1)}if(pet.poops>=3)pet.clean=clamp(pet.clean-steps*.45);if(pet.asleep&&pet.energy>=99){pet.asleep=false;message('Seu amigo acordou descansado!')}if(pet.health<=0){pet.dead=true;pet.asleep=false;message('Seu bichinho precisa de um novo começo 💔')}save()}
const atlases={};for(const speciesId of ['cat','bunny','bear']){const img=new Image();img.src='assets/'+speciesId+'-atlas.png?v=20';atlases[speciesId]=img}
function drawAtlas(ctx){const img=atlases[pet.type];if(!img||!img.complete||!img.naturalWidth)return false;const phase=stage();let cell=phase==='OVO'?0:phase==='CHOCANDO'?1:phase==='BEBÊ'?2:phase==='JOVEM'?4:6;const activity=pet.animation||'';if(pet.asleep||activity==='sleep')cell=7;else if(activity==='play'||activity==='hop'||activity==='stretch')cell=phase==='BEBÊ'?3:5;else if(activity==='eat'||activity==='wash'||activity==='heal')cell=phase==='BEBÊ'?3:cell===4?5:3;else if(pet.joy>80&&Date.now()%7200<1100&&!eggStage())cell=phase==='ADULTO'?6:3;const x=cell%4*24,y=Math.floor(cell/4)*24;ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(img,x,y,24,24,0,0,64,64);ctx.restore();return true}
// The old 24px atlases are intentionally disabled: their reduced resolution
// obscures distinguishing features. The full-size artwork must be exported
// at adequate resolution before we enable image atlases again.
function draw(){
 if(!pet)return;
 const c=$('pet'),ctx=c.getContext('2d'),phase=stage(),t=Date.now();
 ctx.clearRect(0,0,64,64);ctx.imageSmoothingEnabled=false;if(!eggStage()&&!pet.dead&&drawAtlas(ctx))return;
 const p=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,w,h)};
 const oval=(x,y,rx,ry,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()};
 const colors={cat:['#f2aa69','#a66753','#fff3dc','#4d4149','#e78fa4'],bunny:['#e8cdb4','#ab888a','#fff9ef','#6e5665','#efa5b8'],bear:['#bf8057','#855439','#f9dbaa','#57403b','#eb9c9a']}[pet.type]||['#f2aa69','#a66753','#fff3dc','#4d4149','#e78fa4'];
 const [fur,shade,cream,ink,pink]=colors;const frame=Math.floor(t/230)%4,action=pet.animation||'idle';
 if(pet.dead){p(14,52,36,3,shade);p(27,41,10,12,ink);return}
 if(phase==='OVO'||phase==='CHOCANDO'){
  oval(32,34,20,25,ink);oval(32,33,18,23,cream);oval(23,27,6,9,fur);oval(41,43,6,7,fur);oval(32,42,5,5,pink);p(24,17,9,3,'#fff');
  if(phase==='CHOCANDO'){p(29,10,4,11,ink);p(25,21,7,3,ink);p(25,24,3,7,ink);p(28,30,8,3,ink);p(34,33,3,9,ink);oval(37,23,4,4,fur)}
  return;
 }
 const scale=phase==='BEBÊ'?.92:phase==='JOVEM'?.97:1;
 ctx.save();ctx.translate(32,55);ctx.scale(scale,scale);ctx.translate(-32,-55);if(action==='play'&&frame%2===0){ctx.translate(0,-3)}if(action==='stretch'&&frame%2===0){ctx.translate(0,3);ctx.scale(1.1,.91)}
 if(pet.type==='cat'){
  p(9,12,17,24,ink);p(38,12,17,24,ink);p(13,16,10,14,pink);p(41,16,10,14,pink);
  oval(49,48,10,10,shade);oval(51,44,5,7,fur);
 }else if(pet.type==='bunny'){
  oval(18,18,9,19,ink);oval(46,18,9,19,ink);oval(18,18,6,16,pink);oval(46,18,6,16,pink);
  oval(52,48,6,7,cream);
 }else{
  oval(16,22,10,10,ink);oval(48,22,10,10,ink);oval(16,22,6,6,pink);oval(48,22,6,6,pink);
 }
 oval(32,45,21,17,ink);oval(32,44,19,15,fur);oval(32,30,24,21,ink);oval(32,29,22,19,fur);
 if(pet.type==='cat'){oval(20,27,9,12,cream);oval(43,33,10,12,shade);p(8,37,8,2,ink);p(48,37,8,2,ink)}
 if(pet.type==='bunny'){oval(31,40,14,11,cream);oval(20,26,9,9,cream)}
 if(pet.type==='bear'){oval(31,41,13,10,cream);oval(30,36,12,9,cream)}
 oval(22,52,9,6,ink);oval(42,52,9,6,ink);oval(22,51,7,4,fur);oval(42,51,7,4,fur);
 const closing=pet.asleep||(t%4800<170)||action==='sleep'||(action==='wash'&&frame===2);
 if(closing){p(18,35,11,2,ink);p(36,35,11,2,ink)}
 else{oval(23,35,5,7,ink);oval(41,35,5,7,ink);p(24,32,2,3,'#fff');p(42,32,2,3,'#fff')}
 oval(16,42,5,3,pink);oval(48,42,5,3,pink);oval(32,43,4,3,pink);
 if(action==='eat'){oval(32,49,7,frame%2===0?3:6,ink);oval(32,49,4,frame%2===0?2:4,pink)}
 else if(pet.animation==='play'||pet.joy>65){p(27,48,10,2,ink)}
 else{p(29,49,6,2,ink)}
 if(action==='wash'){p(frame%2?9:14,23,5,5,'#9be9ed');p(frame%2?48:43,21,6,6,'#a7f3f5');p(35,12+(frame%3)*2,4,4,'#fff')}
 if(action==='heal'){p(29,18-(frame%2)*3,6,3,'#ef667a');p(30,16-(frame%2)*3,4,8,'#ef667a')}
 if(action==='eat'){p(49-(frame%3)*3,47+(frame%2),8,7,'#e94f5f');p(52-(frame%3)*3,44,3,4,'#78b95b')}
 if(action==='play'){p(48+(frame%3)*2,49+(frame%2)*3,9,9,'#ed7993');p(51+(frame%3)*2,49,2,8,'#ffe4a7')}
 if(pet.animation==='stretch'){p(10,46,12,6,fur);p(45,45,12,6,fur)}
 if(pet.health<25){p(27,23,10,3,'#8ab08e')}
 if(phase==='ADULTO'){p(28,18,8,3,cream);p(30,15,4,4,shade)}if(action==='idle'&&!pet.asleep&&frame===3){p(9,45,6,2,cream)}if(action==='hop'){p(19,54,8,3,pink);p(37,54,8,3,pink)}
 ctx.restore();
}
function render(){if(!pet)return;const currentStage=stage();const face=currentStage==='OVO'?'🥚':currentStage==='CHOCANDO'?'🐣':`<img src="assets/${pet.type}-hd.webp?v=26" onerror="this.onerror=null;this.src='assets/${pet.type}-character.svg?v=25'" draggable="false" alt="${species[pet.type].label}" />`;const hero=$('heroPet');hero.style.fontSize='calc(var(--pet-size) * '+(eggStage()?'.73':'.94')+')';hero.style.scale=eggStage()?'1':currentStage==='BEBÊ'?'.82':currentStage==='JOVEM'?'.93':'1';hero.dataset.mood=pet.asleep?'sleep':pet.hunger<25?'hungry':pet.health<30?'sick':pet.joy>70?'happy':'calm';hero.dataset.phase=currentStage;hero.dataset.activity=pet.animation||'idle';const displayKey=pet.dead?'dead':face;if(hero.dataset.frame!==displayKey){hero.innerHTML=pet.dead?'💫':face;hero.dataset.frame=displayKey;}$('heroPet').style.display='flex';$('pet').classList.add('hidden-pixel');$('heroPet').classList.toggle('pet-egg',eggStage());$('heroPet').classList.toggle('pet-sleep',pet.asleep);const fields=[['🍎 Saciedade','hunger'],['😊 Felicidade','joy'],['⚡ Energia','energy'],['🧼 Higiene','clean'],['❤️ Saúde','health']];$('stats').innerHTML=fields.map(([t,k])=>'<div class="stat"><label><span>'+t+'</span><span>'+Math.round(pet[k])+'%</span></label><div class="track"><div class="fill '+(pet[k]<30?'low':'')+'" style="width:'+pet[k]+'%"></div></div></div>').join('')+'<div class="stat"><label><span>🪙 Moedas</span><span>'+pet.coins+'</span></label><div class="track"><div class="fill" style="width:'+Math.min(100,pet.coins)+'%"></div></div></div>';
let droppings=$('scene').querySelector('.spark');if(!droppings){droppings=document.createElement('span');droppings.className='spark';$('scene').appendChild(droppings)}droppings.textContent=eggStage()?'':'💩'.repeat(pet.poops||0);$('petName').textContent=pet.name;$('petMeta').textContent=species[pet.type].label+' • '+stage()+' • '+age()+' min';$('dayLabel').textContent='DIA '+(1+Math.floor(age()/12));$('life').textContent=stage();$('coins').textContent='★ '+pet.coins;
let mood=pet.dead?'💔 ADEUS':eggStage()?(stage()==='OVO'?'🥚 AQUECENDO':'✨ RACHANDO'):pet.asleep?'💤 DORMINDO':pet.health<25?'🤒 DOENTE':pet.hunger<25?'🍽 COM FOME':pet.clean<25?'🧼 SUJINHO':pet.joy<25?'😢 TRISTE':'😊 CONTENTE';$('mood').textContent=mood;$('status').textContent=mood; $('pet').classList.toggle('sleep',pet.asleep);$('pet').classList.toggle('egg',eggStage());$('pet').classList.toggle('sick',pet.health<30);
$('weather').textContent=new Date().getHours()>18||new Date().getHours()<6?'☾ NOITE':'☀ DIA';
$('actions').querySelectorAll('button').forEach((el,i)=>{el.style.borderColor=i===actionIndex?'#d87592':'#e9dfd8';el.disabled=pet.dead});
}
function react(kind,duration=1250){if(!pet)return;pet.animation=kind;animUntil=Date.now()+duration;const el=$('heroPet');el.classList.remove('reaction-eat','reaction-play','reaction-wash','reaction-heal','reaction-sleep','reaction-stretch','reaction-hop');void el.offsetWidth;el.classList.add('reaction-'+kind);if(kind==='sleep')sparkle('💤');if(kind==='wash')sparkle('🫧');if(kind==='heal')sparkle('💚');if(kind==='eat')sparkle('🍎');if(kind==='play')sparkle('💞')}
function sparkle(e){let node=document.createElement('span');node.className='effect';node.textContent=e;$('scene').appendChild(node);setTimeout(()=>node.remove(),1100)}
function act(type){if(!pet||pet.dead)return;updateTime();if(eggStage()){if(type==='feed'||type==='play'){react('hop',900);pet.joy=clamp(pet.joy+4);pet.health=clamp(pet.health+3);sparkle('💗');beep(530);message(type==='feed'?'Você aqueceu o ovo com carinho!':'O ovo balançou ao ouvir você!');save();render()}else{beep(260,.1);message('🥚 Espere o nascimento para usar essa ação. Por enquanto, toque no ovo!')}return}if(type==='game'){minigame();return}if(type==='feed'){foodMenu();return}beep(580);

if(type==='play'){if(pet.energy<10){message('Está muito cansado para brincar.');return}pet.joy=clamp(pet.joy+23);pet.energy=clamp(pet.energy-12);pet.hunger=clamp(pet.hunger-6);pet.plays++;react('play',1300);sparkle('💗');$('pet').classList.add('hop');setTimeout(()=>$('pet').classList.remove('hop'),950);message(pet.name+' adorou brincar com você!')}
if(type==='sleep'){pet.asleep=!pet.asleep;react('sleep',950);if(pet.asleep){sparkle('💤');message('Boa noite! A energia se recupera com o tempo.')}else message('Bom dia! '+pet.name+' acordou!')}
if(type==='clean'){pet.clean=clamp(pet.clean+42);pet.poops=0;pet.baths=(pet.baths||0)+1;react('wash',1800);sparkle('🫧');message('Banho tomado! Cheirinho de limpeza!')}
if(type==='heal'){if(pet.coins<4){message('São necessárias 4 moedas para o remédio.');return}pet.coins-=4;pet.health=clamp(pet.health+35);react('heal',1350);sparkle('❤️');message('Cuidado recebido! A saúde melhorou.')}
save();render()}
function foodMenu(){open('<h2>🍽 Hora de comer!</h2><p>Escolha a refeição do seu amigo.</p><div class="food-grid">'+foods.map((f,i)=>'<button data-food="'+i+'"><span>'+f.emoji+'</span>'+f.name+'<br>★ '+f.cost+' moedas</button>').join('')+'</div><button class="primary" style="background:#9295a4" id="cancelFood">VOLTAR</button>');$('cancelFood').onclick=close;document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{const food=foods[Number(b.dataset.food)];if(pet.coins<food.cost){message('Você precisa de '+food.cost+' moedas para comprar '+food.name+'.');beep(180,.2);close();return}pet.coins-=food.cost;pet.hunger=clamp(pet.hunger+food.full);pet.joy=clamp(pet.joy+food.joy);pet.clean=clamp(pet.clean-4);react('eat',1450);sparkle(food.emoji);beep(840);message(pet.name+' adorou '+food.name+'!');save();close();render()})}
function achievements(){open('<h2>🏆 Conquistas</h2><p>Complete desafios enquanto seu amigo cresce.</p>'+awards.map(a=>'<div class="achievement '+(a.ok(pet)?'':'locked')+'">'+(a.ok(pet)?'✅':'🔒')+' '+a.label+'</div>').join('')+'<button class="primary" id="achClose">VOLTAR</button>');$('achClose').onclick=close}
function minigame(){open('<h2>🎲 Adivinhe o presente!</h2><p>Escolha uma das caixas. Você pode ganhar até 8 moedas!</p><div class="choices"><button data-guess="0">🎁</button><button data-guess="1">🎁</button><button data-guess="2">🎁</button></div><p class="help">Brinque para ganhar moedas e cuidar do seu amigo.</p>');const winner=Math.floor(Math.random()*3);document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{let won=Number(b.dataset.guess)===winner;beep(won?900:330,.13);pet.coins+=won?8:2;pet.joy=clamp(pet.joy+10);react('play',1100);save();close();sparkle(won?'🌟':'💗');message(won?'Acertou! +8 moedas!':'Quase! +2 moedas pela tentativa.');render()})}
function open(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}
function close(){$('overlay').classList.add('hidden')}
function welcome(){open('<h2>🥚 Um novo amigo!</h2><p>Escolha seu bichinho, dê um nome e cuide dele todos os dias. Ele começa no ovo, choca e cresce visualmente!</p><div class="choices" id="types">'+Object.entries(species).map(([k,v])=>'<button data-type="'+k+'" class="'+(k===selected?'selected':'')+'" title="'+v.label+'">'+v.symbol+'</button>').join('')+'</div><p><input id="nickname" maxlength="18" placeholder="Nome do bichinho" value="Pipoca" aria-label="Nome do bichinho"></p><button class="primary" id="begin">ADOTAR MEU BICHINHO ♥</button>');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('selected',x===b))});$('begin').onclick=()=>{pet=initial($('nickname').value.trim().slice(0,18),selected);save();close();message('🥚 Seu ovo chegou! Toque nele e acompanhe seu nascimento.');render()}}
function help(){open('<h2>📖 Como jogar</h2><p>Cuide do seu bichinho com os seis botões. Alimente quando estiver com fome, brinque para aumentar a felicidade, dê banho e deixe dormir para recuperar energia.</p><p>O tempo passa automaticamente, mesmo com o jogo fechado. O ovo racha após 2 minutos e nasce depois de 4 minutos. O bichinho cresce de tamanho até ficar adulto. No minijogo, ganhe moedas para comprar remédios.</p><p class="help">Os botões da console ◀ ● ▶ selecionam e executam as ações. O progresso fica salvo neste navegador.</p><button class="primary" id="ok">ENTENDI!</button>');$('ok').onclick=close}
function reset(){open('<h2>Recomeçar aventura?</h2><p>Isso apaga o bichinho atual e todo o progresso salvo neste navegador.</p><button class="primary" id="yes">SIM, RECOMEÇAR</button><button class="primary" style="background:#8c91a4" id="no">CANCELAR</button>');$('yes').onclick=()=>{localStorage.removeItem(KEY);pet=null;welcome()};$('no').onclick=close}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&species[saved.type]&&typeof saved.born==='number'){pet={...initial(saved.name,saved.type),...saved};if(!('phaseVersion' in saved))pet.phaseVersion=1;pet.animation='';updateTime()}}catch(e){console.warn('Save inválido',e)}
$('actions').addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(btn){actionIndex=actions.indexOf(btn.dataset.act);act(btn.dataset.act)}});
$('prev').onclick=()=>{actionIndex=(actionIndex+5)%6;render();message('Selecionado: '+$('actions').children[actionIndex].innerText)};
$('next').onclick=()=>{actionIndex=(actionIndex+1)%6;render();message('Selecionado: '+$('actions').children[actionIndex].innerText)};
$('select').onclick=()=>act(actions[actionIndex]);$('pet').onclick=()=>{sparkle(eggStage()?'🥚':'💞');act('play')};$('heroPet').onclick=()=>{sparkle(eggStage()?'🥚':'💞');act('play')};$('helpBtn').onclick=help;$('resetBtn').onclick=reset;$('achBtn').onclick=()=>{if(pet)achievements()};$('soundBtn').onclick=()=>{soundOn=!soundOn;localStorage.setItem('bichovirtual_sound',soundOn?'on':'off');$('soundBtn').textContent=soundOn?'🔊 Som':'🔇 Mudo';if(soundOn)beep(700)};$('soundBtn').textContent=soundOn?'🔊 Som':'🔇 Mudo';
function animatePet(){if(pet&&!pet.dead){const time=Date.now(),alive=!pet.asleep&&!eggStage();if(animUntil&&time>animUntil){pet.animation='';animUntil=0;$('heroPet').classList.remove('reaction-eat','reaction-play','reaction-wash','reaction-heal','reaction-sleep','reaction-stretch','reaction-hop');render()}if(alive&&!animUntil&&time-lastIdle>6500){lastIdle=time;const roll=Math.random();if(roll<.45)react('stretch',1100);else if(roll<.8)react('hop',1050);else if(roll<.93){pet.coins+=2;save();sparkle('⭐ +2');message(pet.name+' encontrou duas moedas!')}else message(pet.name+' está olhando as nuvens ☁')}const drift=alive?Math.sin(time/1400)*Math.min(9,Math.max(3,$('scene').clientWidth*.02)):0;const shadow=$('petShadow');shadow.style.transform='translateX(-50%) scale('+(pet.animation==='play'||pet.animation==='hop'?.76:1)+')';shadow.style.opacity=(pet.animation==='play'||pet.animation==='hop'?.24:.48);const prop=$('sceneProp');const act=pet.animation||'';const propVal=act==='eat'?'🥣':act==='play'?'🧶':act==='wash'?'🫧':act==='heal'?'💚':pet.asleep?'💤':'';if(prop.dataset.value!==propVal){prop.dataset.value=propVal;prop.textContent=propVal}$('heroPet').style.marginLeft=drift+'px';$('pet').style.marginLeft=drift+'px'}animationFrame=requestAnimationFrame(animatePet)}
function heartbeat(){let now=new Date();$('clock').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(pet){updateTime();evolve();render()}}
heartbeat();if(!pet)welcome();animationFrame=requestAnimationFrame(animatePet);timer=setInterval(heartbeat,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)heartbeat()});
})();
</script></body></html>
