!important}.hero-pet.reaction-wash,.hero-pet.reaction-heal{animation:hero-wash .4s ease-in-out 3!important}.hero-pet img{user-select:none;-webkit-user-drag:none}.scene-prop{transition:opacity .2s ease}/* v2.6: real 144px transparent pixel art; all species now share a sharp rendering path. */

<body>
<main class="layout">
<header class="top"><strong>✦ BICHO VIRTUAL <span class="version-stamp">V3.2</span> ✦</strong><span id="clock"></span></header>
<section class="console" aria-label="Console de bichinho virtual">
<div class="bezel"><div class="screen">
<div class="screen-head"><span id="dayLabel">DIA 1</span><span id="weather">☀ ENSOLARADO</span></div>
<div class="scene" id="scene"><span class="cloud a">✿</span><span class="cloud b">✦</span><div class="floor"></div><div id="petShadow" class="pet-shadow"></div><div id="sceneProp" class="scene-prop"></div><span id="heroPet" class="hero-pet" aria-label="Seu bichinho" role="img">🥚</span><canvas id="pet" width="64" height="64" aria-label="Desenho alternativo" style="display:none"></canvas></div>
<div class="screen-bottom"><span id="status">♥ FELIZ</span><span class="tiny-pill" id="life">BEBÊ</span><span id="coins">★ 15</span></div>
</div></div>
<div class="nameplate">♡ LOVE YOUR LITTLE FRIEND ♡</div>
<div class="hardware"><button class="hardbtn" id="prev" aria-label="Ação anterior">◀</button><button class="hardbtn" id="select" aria-label="Selecionar ação">●</button><button class="hardbtn" id="next" aria-label="Próxima ação">▶</button></div>
</section>
<section class="dashboard">
<div class="identity"><div><h1 id="petName">Meu bichinho</h1><p id="petMeta">Seu novo melhor amigo</p></div><span class="tag" id="mood">😊 CONTENTE</span></div>
<div class="stats" id="stats"></div>
<div class="actions" id="actions">
<button class="action" data-act="feed"><i>🍎</i>Alimentar</button><button class="action" data-act="play"><i>🎾</i>Brincar</button><button class="action" data-act="sleep"><i>🌙</i>Dormir</button><button class="action" data-act="clean"><i>🧼</i>Banho</button><button class="action" data-act="heal"><i>💊</i>Cuidar</button><button class="action" data-act="game"><i>🎮</i>Minijogo</button>
</div><div id="message" class="message" role="status">Seu bichinho está esperando carinho!</div>
</section>
<footer class="footer"><span>Salvo automaticamente neste aparelho</span><button id="soundBtn" aria-label="Alternar som">🔊 Som</button><button id="achBtn">Conquistas</button><button id="helpBtn">Como jogar</button><button id="resetBtn">Recomeçar</button></footer>
</main>
<div class="overlay hidden" id="overlay"><section class="modal" id="modal" aria-live="polite"></section></div>
<script src="assets/pet-art.js"></script>
<script>
(()=>{'use strict';
const KEY='bichovirtual_save_v1',TICK=300000,MAX=100,GAME_COOLDOWN_MS=60000;
const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(MAX,n));
let storageError=false;
function storageFailure(){storageError=true;const badge=document.querySelector('.version-stamp');if(badge){badge.textContent='V3.2 ⚠';badge.title='Salvamento automático indisponível neste navegador';}}
function storageGet(key){try{return localStorage.getItem(key)}catch(e){storageFailure();return null}}
function storageSet(key,value){try{localStorage.setItem(key,value);return true}catch(e){storageFailure();return false}}
function storageRemove(key){try{localStorage.removeItem(key);return true}catch(e){storageFailure();return false}}
const species={cat:{symbol:'🐱',label:'Gatinho',color:'#f0a66b',ear:true},bunny:{symbol:'🐰',label:'Coelhinho',color:'#e9d8ca',ear:true},bear:{symbol:'🐻',label:'Ursinho',color:'#bf9c75',ear:false}};
let pet=null,selected='cat',actionIndex=0,timer=null,animationFrame=0,animUntil=0,lastIdle=Date.now(),soundOn=storageGet('bichovirtual_sound')!=='off',audioCtx=null;const foods=[{name:'Maçã',emoji:'🍎',cost:0,full:16,joy:2},{name:'Ração',emoji:'🥣',cost:2,full:32,joy:0},{name:'Bolo',emoji:'🍰',cost:5,full:22,joy:18},{name:'Banquete',emoji:'🍱',cost:9,full:52,joy:12}];const awards=[{id:'start',label:'🥚 Primeira amizade',ok:p=>!!p.born},{id:'plays',label:'🎾 Companheiro de brincadeiras',ok:p=>p.plays>=10},{id:'child',label:'🌱 Crescer é uma aventura',ok:p=>age()>=3},{id:'adult',label:'⭐ Amigo para toda vida',ok:p=>age()>=12},{id:'rich',label:'🪙 Colecionador',ok:p=>p.coins>=50},{id:'clean',label:'🫧 Dia de spa',ok:p=>p.baths>=5}];
const actions=['feed','play','sleep','clean','heal','game'];
function message(s){$('message').textContent=s}function beep(freq=600,duration=.09){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function save(){return pet?storageSet(KEY,JSON.stringify({...pet,animation:''})):false}
function initial(name,type){return{name:name||'Pipoca',type,born:Date.now(),updated:Date.now(),hunger:78,joy:85,energy:86,clean:90,health:100,coins:15,asleep:false,poops:0,plays:0,baths:0,lastGameAt:0,stage:0,phaseVersion:2,dead:false}}
function age(){return Math.floor((Date.now()-pet.born)/60000)}
function stage(){const t=(Date.now()-pet.born)/60000;if(pet.phaseVersion!==2)return t<3?'BEBÊ':t<12?'JOVEM':'ADULTO';return t<2?'OVO':t<4?'CHOCANDO':t<12?'BEBÊ':t<25?'JOVEM':'ADULTO'}
function eggStage(){return stage()==='OVO'||stage()==='CHOCANDO'}
function evolve(){if(!pet||pet.dead)return;const phase=stage();if(!pet.lastPhase){pet.lastPhase=phase;save();return}if(phase===pet.lastPhase)return;pet.lastPhase=phase;if(phase==='CHOCANDO'){message('🥚 O ovo começou a rachar!');sparkle('✨');beep(750,.12)}else if(phase==='BEBÊ'){message('🎉 NASCEU! '+pet.name+' saiu do ovo!');sparkle('🌟');beep(900,.23)}else if(phase==='JOVEM'){message('🌱 '+pet.name+' cresceu! Já é jovem!');sparkle('⭐');beep(860,.2)}else if(phase==='ADULTO'){message('👑 '+pet.name+' virou adulto!');sparkle('👑');beep(980,.25)}save()}
function updateTime(){if(!pet||pet.dead)return;let now=Date.now(),steps=Math.min(288,Math.floor((now-pet.updated)/TICK));if(steps<=0)return;pet.updated=now;pet.hunger=clamp(pet.hunger-steps*.8);pet.clean=clamp(pet.clean-steps*.45);pet.energy=clamp(pet.energy+(pet.asleep?steps*2.8:-steps*.55));pet.joy=clamp(pet.joy-steps*.5);if(pet.hunger<20||pet.clean<18||pet.energy<12)pet.health=clamp(pet.health-steps*.18);else if(pet.health<100)pet.health=clamp(pet.health+steps*.1);pet.poopCounter=(pet.poopCounter||0)+steps;while(pet.poopCounter>=35){pet.poopCounter-=35;pet.poops=Math.min(4,pet.poops+1)}if(pet.poops>=3)pet.clean=clamp(pet.clean-steps*.45);if(pet.asleep&&pet.energy>=99){pet.asleep=false;message('Seu amigo acordou descansado!')}if(pet.health<=0){pet.dead=true;pet.asleep=false;message('Seu bichinho precisa de um novo começo 💔')}save()}
// High-resolution character images are rendered by the hero element; legacy 24px canvas atlas retired.

const eggColors={cat:['#fff4d2','#f5c17b','#d8935b'],bunny:['#fff8f3','#f0c4d2','#ce9eae'],bear:['#fff2c6','#e9bc75','#bb8c56']};
const eggCache=Object.create(null);
function eggSvg(type,cracked){
  const key=type+(cracked?'_cracked':'_whole');
  if(eggCache[key])return eggCache[key];
  const [light,mid,shade]=eggColors[type]||eggColors.cat;
  const radii=[0,0,3,4,5,6,7,8,8,9,9,9,9,9,9,9,9,9,9,8,7,6,4];
  let shell='';
  for(let y=2;y<=22;y++){
    const r=radii[y];
    for(let x=12-r;x<=12+r;x++){
      const edge=x===12-r||x===12+r||y===2||y===22;
      const color=edge?'#604a61':x<9&&y<16?light:x>16?shade:mid;
      shell+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+color+'"/>';
    }
  }
  const emblem=type==='cat'?'<path d="M9 10V8l2 1 2-1 2 1 2-1v5l-4 2-4-2z" fill="#fff6eb" stroke="#a8796a" stroke-width=".6"/>':type==='bunny'?'<path d="M10 11V7h2v4h1V7h2v4l2 2-4 2-4-2z" fill="#fff7f7" stroke="#a98a98" stroke-width=".6"/>':'<path d="M9 11V9h2v1h4V9h2v2l1 2-5 3-5-3z" fill="#fff2d8" stroke="#a77c5a" stroke-width=".6"/>';
  const crack=cracked?'<path d="M4 13h3v-2h3v3h3v-3h3v2h3v-2h2" fill="none" stroke="#594357" stroke-width="1.1" stroke-linejoin="miter"/><rect x="10" y="7" width="1" height="1" fill="#5b4558"/><rect x="15" y="7" width="1" height="1" fill="#5b4558"/>':'';
  return eggCache[key]='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" shape-rendering="crispEdges">'+shell+emblem+crack+'</svg>';
}
function render(){if(!pet)return;const currentStage=stage();const requestedPose=pet.dead?'sleep':pet.asleep?'sleep':pet.animation|| (pet.health<30?'sick':pet.hunger<25?'hungry':pet.joy>80?'happy':'idle');const pose=PixelPets.poses.includes(requestedPose)?requestedPose:'idle';const face=eggStage()?eggSvg(pet.type,currentStage==='CHOCANDO'):`<img src="${PixelPets.url(pet.type)}#${pose}" draggable="false" alt="${species[pet.type].label}" />`;const hero=$('heroPet');hero.style.fontSize='calc(var(--pet-size) * '+(eggStage()?'.73':'.94')+')';hero.style.scale=eggStage()?'1':currentStage==='BEBÊ'?'.82':currentStage==='JOVEM'?'.93':'1';hero.dataset.mood=pet.dead?'dead':pet.asleep?'sleep':pet.health<30?'sick':pet.hunger<25?'hungry':pet.joy>70?'happy':'calm';hero.dataset.phase=currentStage;hero.dataset.activity=pet.animation||'idle';const displayKey=face;if(hero.dataset.frame!==displayKey){hero.innerHTML=face;hero.dataset.frame=displayKey;}$('heroPet').style.display='flex';$('pet').classList.add('hidden-pixel');$('heroPet').classList.toggle('pet-egg',eggStage());$('heroPet').classList.toggle('pet-sleep',pet.asleep);const fields=[['🍎 Saciedade','hunger'],['😊 Felicidade','joy'],['⚡ Energia','energy'],['🧼 Higiene','clean'],['❤️ Saúde','health']];$('stats').innerHTML=fields.map(([t,k])=>'<div class="stat"><label><span>'+t+'</span><span>'+Math.round(pet[k])+'%</span></label><div class="track"><div class="fill '+(pet[k]<30?'low':'')+'" style="width:'+pet[k]+'%"></div></div></div>').join('')+'<div class="stat"><label><span>🪙 Moedas</span><span>'+pet.coins+'</span></label><div class="track"><div class="fill" style="width:'+Math.min(100,pet.coins)+'%"></div></div></div>';
let droppings=$('scene').querySelector('.spark');if(!droppings){droppings=document.createElement('span');droppings.className='spark';$('scene').appendChild(droppings)}droppings.textContent=eggStage()?'':'💩'.repeat(pet.poops||0);$('petName').textContent=pet.name;$('petMeta').textContent=species[pet.type].label+' • '+stage()+' • '+age()+' min';$('dayLabel').textContent='DIA '+(1+Math.floor(age()/12));$('life').textContent=stage();$('coins').textContent='★ '+pet.coins;
let mood=pet.dead?'💔 ADEUS':eggStage()?(stage()==='OVO'?'🥚 AQUECENDO':'✨ RACHANDO'):pet.asleep?'💤 DORMINDO':pet.health<25?'🤒 DOENTE':pet.hunger<25?'🍽 COM FOME':pet.clean<25?'🧼 SUJINHO':pet.joy<25?'😢 TRISTE':'😊 CONTENTE';$('mood').textContent=mood;$('status').textContent=mood; $('pet').classList.toggle('sleep',pet.asleep);$('pet').classList.toggle('egg',eggStage());$('pet').classList.toggle('sick',pet.health<30);
$('weather').textContent=new Date().getHours()>18||new Date().getHours()<6?'☾ NOITE':'☀ DIA';
$('actions').querySelectorAll('button').forEach((el,i)=>{el.style.borderColor=i===actionIndex?'#d87592':'#e9dfd8';el.disabled=pet.dead});
}
function react(kind,duration=1250){if(!pet)return;lastIdle=Date.now();pet.animation=kind;animUntil=Date.now()+duration;const el=$('heroPet');el.classList.remove('reaction-eat','reaction-play','reaction-wash','reaction-heal','reaction-sleep','reaction-stretch','reaction-hop');void el.offsetWidth;el.classList.add('reaction-'+kind);if(kind==='sleep')sparkle('💤');if(kind==='wash')sparkle('🫧');if(kind==='heal')sparkle('💚');if(kind==='eat')sparkle('🍎');if(kind==='play')sparkle('💞');render()}
function sparkle(e){let node=document.createElement('span');node.className='effect';node.textContent=e;$('scene').appendChild(node);setTimeout(()=>node.remove(),1100)}
function act(type){if(!pet||pet.dead)return;updateTime();if(pet.asleep&&['feed','play','game'].includes(type)){message('💤 Seu amigo está dormindo. Acorde-o antes dessa atividade.');return}if(eggStage()){if(type==='feed'||type==='play'){react('hop',900);pet.joy=clamp(pet.joy+4);pet.health=clamp(pet.health+3);sparkle('💗');beep(530);message(type==='feed'?'Você aqueceu o ovo com carinho!':'O ovo balançou ao ouvir você!');save();render()}else{beep(260,.1);message('🥚 Espere o nascimento para usar essa ação. Por enquanto, toque no ovo!')}return}if(type==='game'){minigame();return}if(type==='feed'){foodMenu();return}beep(580);

if(type==='play'){if(pet.energy<10){message('Está muito cansado para brincar.');return}pet.joy=clamp(pet.joy+23);pet.energy=clamp(pet.energy-12);pet.hunger=clamp(pet.hunger-6);pet.plays++;react('play',1300);sparkle('💗');$('pet').classList.add('hop');setTimeout(()=>$('pet').classList.remove('hop'),950);message(pet.name+' adorou brincar com você!')}
if(type==='sleep'){pet.asleep=!pet.asleep;react(pet.asleep?'sleep':'stretch',950);if(pet.asleep){sparkle('💤');message('Boa noite! A energia se recupera com o tempo.')}else message('Bom dia! '+pet.name+' acordou!')}
if(type==='clean'){pet.clean=clamp(pet.clean+42);pet.poops=0;pet.baths=(pet.baths||0)+1;react('wash',1800);sparkle('🫧');message('Banho tomado! Cheirinho de limpeza!')}
if(type==='heal'){if(pet.coins<4){message('São necessárias 4 moedas para o remédio.');return}pet.coins-=4;pet.health=clamp(pet.health+35);react('heal',1350);sparkle('❤️');message('Cuidado recebido! A saúde melhorou.')}
save();render()}
function foodMenu(){open('<h2>🍽 Hora de comer!</h2><p>Escolha a refeição do seu amigo.</p><div class="food-grid">'+foods.map((f,i)=>'<button data-food="'+i+'"><span>'+f.emoji+'</span>'+f.name+'<br>★ '+f.cost+' moedas</button>').join('')+'</div><button class="primary" style="background:#9295a4" id="cancelFood">VOLTAR</button>');$('cancelFood').onclick=close;document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{const food=foods[Number(b.dataset.food)];if(pet.coins<food.cost){message('Você precisa de '+food.cost+' moedas para comprar '+food.name+'.');beep(180,.2);close();return}pet.coins-=food.cost;pet.hunger=clamp(pet.hunger+food.full);pet.joy=clamp(pet.joy+food.joy);pet.clean=clamp(pet.clean-4);react('eat',1450);sparkle(food.emoji);beep(840);message(pet.name+' adorou '+food.name+'!');save();close();render()})}
function achievements(){open('<h2>🏆 Conquistas</h2><p>Complete desafios enquanto seu amigo cresce.</p>'+awards.map(a=>'<div class="achievement '+(a.ok(pet)?'':'locked')+'">'+(a.ok(pet)?'✅':'🔒')+' '+a.label+'</div>').join('')+'<button class="primary" id="achClose">VOLTAR</button>');$('achClose').onclick=close}
function minigame(){const remaining=Math.max(0,GAME_COOLDOWN_MS-(Date.now()-(pet.lastGameAt||0)));if(remaining>0){message('🎲 Aguarde '+Math.ceil(remaining/1000)+'s para jogar novamente.');return}open('<h2>🎲 Adivinhe o presente!</h2><p>Escolha uma das caixas. Você pode ganhar até 8 moedas!</p><div class="choices"><button data-guess="0">🎁</button><button data-guess="1">🎁</button><button data-guess="2">🎁</button></div><p class="help">Uma rodada por minuto. Brinque para ganhar moedas e cuidar do seu amigo.</p>');const winner=Math.floor(Math.random()*3);let resolved=false;document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{if(resolved)return;resolved=true;document.querySelectorAll('[data-guess]').forEach(button=>button.disabled=true);const won=Number(b.dataset.guess)===winner;pet.lastGameAt=Date.now();beep(won?900:330,.13);pet.coins+=won?8:2;pet.joy=clamp(pet.joy+10);react('play',1100);save();close();sparkle(won?'🌟':'💗');message(won?'Acertou! +8 moedas!':'Quase! +2 moedas pela tentativa.');render()})}
function open(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}
function close(){$('overlay').classList.add('hidden')}
function welcome(){open('<h2>🥚 Um novo amigo!</h2><p>Escolha seu bichinho, dê um nome e cuide dele todos os dias. Ele começa no ovo, choca e cresce visualmente!</p><div class="choices" id="types">'+Object.entries(species).map(([k,v])=>'<button data-type="'+k+'" class="'+(k===selected?'selected':'')+'" title="'+v.label+'">'+'<img src="'+PixelPets.url(k)+'#idle" alt="'+v.label+'" draggable="false"><span>'+v.label+'</span></button>').join('')+'</div><p><input id="nickname" maxlength="18" placeholder="Nome do bichinho" value="Pipoca" aria-label="Nome do bichinho"></p><button class="primary" id="begin">ADOTAR MEU BICHINHO ♥</button>');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('selected',x===b))});$('begin').onclick=()=>{pet=initial($('nickname').value.trim().slice(0,18),selected);lastIdle=Date.now();save();close();message('🥚 Seu ovo chegou! Toque nele e acompanhe seu nascimento.');render()}}
function exportBackup(){
 if(!pet){message('Adote um bichinho antes de criar o backup.');return}
 const data={format:'bichovirtual-backup',version:1,exportedAt:new Date().toISOString(),pet:{...pet,animation:''}};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='bicho-virtual-backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 message('Backup gerado! Guarde o arquivo em um lugar seguro.');
}
function normalizeBackup(data){
 if(!data||data.format!=='bichovirtual-backup'||data.version!==1)throw Error('Formato de backup não reconhecido.');
 const p=data.pet,now=Date.now();
 if(!p||!species[p.type]||typeof p.name!=='string'||!p.name.trim()||p.name.length>18)throw Error('Nome ou espécie inválidos.');
 if(!Number.isFinite(p.born)||p.born<946684800000||p.born>now+60000||!Number.isFinite(p.updated)||p.updated<p.born-86400000||p.updated>now+60000)throw Error('Datas inválidas.');
 for(const key of ['hunger','joy','energy','clean','health'])if(!Number.isFinite(p[key])||p[key]<0||p[key]>100)throw Error('Indicador inválido: '+key);
 if(!Number.isSafeInteger(p.coins)||p.coins<0||p.coins>1000000)throw Error('Moedas inválidas.');
 for(const key of ['poops','plays','baths'])if(p[key]!==undefined&&(!Number.isSafeInteger(p[key])||p[key]<0||p[key]>1000000))throw Error('Contador inválido: '+key);
 return {...initial(p.name.trim(),p.type),name:p.name.trim(),born:p.born,updated:p.updated,
 hunger:p.hunger,joy:p.joy,energy:p.energy,clean:p.clean,health:p.health,coins:p.coins,
 asleep:p.asleep===true,poops:Math.min(4,p.poops||0),plays:p.plays||0,baths:p.baths||0,
 phaseVersion:p.phaseVersion===1?1:2,dead:p.dead===true,poopCounter:Number.isFinite(p.poopCounter)?Math.max(0,Math.min(35,p.poopCounter)):0,
 lastBonusAt:Number.isFinite(p.lastBonusAt)?p.lastBonusAt:0,lastGameAt:Number.isFinite(p.lastGameAt)?Math.max(0,Math.min(now,p.lastGameAt)):0,lastPhase:typeof p.lastPhase==='string'?p.lastPhase:undefined,animation:''};
}
async function importBackup(file){
 if(!file)return;
 if(file.size>200000){message('Arquivo muito grande para ser um backup válido.');close();return}
 try{
  const data=JSON.parse(await file.text()),restored=normalizeBackup(data);
  const serialized=JSON.stringify({...restored,animation:''});
  if(!storageSet(KEY,serialized))throw Error('O navegador bloqueou o salvamento. Libere o armazenamento antes de restaurar.');
  pet=restored;animUntil=0;lastIdle=Date.now();updateTime();evolve();close();render();
  message('Backup restaurado! Seu bichinho voltou com o progresso salvo.');
 }catch(e){close();message('Não foi possível restaurar: '+e.message)}
}
function help(){open('<h2>📖 Como jogar</h2><p>Cuide do seu bichinho com os seis botões. Alimente, brinque, dê banho e deixe dormir para recuperar energia.</p><p>O tempo passa mesmo com o jogo fechado. O ovo racha após 2 minutos e nasce depois de 4 minutos.</p><p class="help">O progresso é salvo neste navegador. Faça um backup para não perdê-lo ao trocar de aparelho ou limpar os dados.</p><div class="backup-actions"><button type="button" id="backupExport">📤 Baixar backup</button><label class="backup-import">📥 Restaurar backup<input id="backupFile" type="file" accept=".json,application/json" aria-label="Escolher arquivo de backup"></label></div><p class="help">Restaurar substitui o bichinho atual. Guarde o arquivo em local privado.</p><button class="primary" id="ok">ENTENDI!</button>');
 $('ok').onclick=close;$('backupExport').onclick=exportBackup;$('backupFile').onchange=e=>importBackup(e.target.files[0]);
}
function reset(){open('<h2>Recomeçar aventura?</h2><p>Isso apaga o bichinho atual e todo o progresso salvo neste navegador.</p><button class="primary" id="yes">SIM, RECOMEÇAR</button><button class="primary" style="background:#8c91a4" id="no">CANCELAR</button>');$('yes').onclick=()=>{storageRemove(KEY);pet=null;welcome()};$('no').onclick=close}
try{const saved=JSON.parse(storageGet(KEY));if(saved&&species[saved.type]&&typeof saved.born==='number'){pet={...initial(saved.name,saved.type),...saved};if(!('phaseVersion' in saved))pet.phaseVersion=1;pet.animation='';updateTime()}}catch(e){console.warn('Save inválido',e)}
$('actions').addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(btn){actionIndex=actions.indexOf(btn.dataset.act);act(btn.dataset.act)}});
$('prev').onclick=()=>{actionIndex=(actionIndex+5)%6;render();message('Selecionado: '+$('actions').children[actionIndex].innerText)};
$('next').onclick=()=>{actionIndex=(actionIndex+1)%6;render();message('Selecionado: '+$('actions').children[actionIndex].innerText)};
$('select').onclick=()=>act(actions[actionIndex]);$('pet').onclick=()=>{sparkle(eggStage()?'🥚':'💞');act('play')};$('heroPet').onclick=()=>{sparkle(eggStage()?'🥚':'💞');act('play')};$('helpBtn').onclick=help;$('resetBtn').onclick=reset;$('achBtn').onclick=()=>{if(pet)achievements()};$('soundBtn').onclick=()=>{soundOn=!soundOn;storageSet('bichovirtual_sound',soundOn?'on':'off');$('soundBtn').textContent=soundOn?'🔊 Som':'🔇 Mudo';if(soundOn)beep(700)};$('soundBtn').textContent=soundOn?'🔊 Som':'🔇 Mudo';
function animatePet(){if(pet&&!pet.dead){const time=Date.now(),alive=!pet.asleep&&!eggStage();if(animUntil&&time>animUntil){pet.animation='';animUntil=0;$('heroPet').classList.remove('reaction-eat','reaction-play','reaction-wash','reaction-heal','reaction-sleep','reaction-stretch','reaction-hop');render()}if(alive&&!animUntil&&time-lastIdle>6500){lastIdle=time;const roll=Math.random();if(roll<.45)react('stretch',1100);else if(roll<.8)react('hop',1050);else if(roll<.93){if(time-(pet.lastBonusAt||0)>=15*60000){pet.lastBonusAt=time;pet.coins+=2;save();sparkle('⭐ +2');message(pet.name+' encontrou duas moedas!')}else message(pet.name+' está explorando o jardim 🌿')}else message(pet.name+' está olhando as nuvens ☁')}const drift=alive?Math.sin(time/1400)*Math.min(9,Math.max(3,$('scene').clientWidth*.02)):0;const shadow=$('petShadow');shadow.style.transform='translateX(-50%) scale('+(pet.animation==='play'||pet.animation==='hop'?.76:1)+')';shadow.style.opacity=(pet.animation==='play'||pet.animation==='hop'?.24:.48);const prop=$('sceneProp');const act=pet.animation||'';const propVal=act==='eat'?'🥣':act==='play'?'🧶':act==='wash'?'🫧':act==='heal'?'💚':pet.asleep?'💤':'';if(prop.dataset.value!==propVal){prop.dataset.value=propVal;prop.textContent=propVal}$('heroPet').style.marginLeft=drift+'px';$('pet').style.marginLeft=drift+'px'}animationFrame=requestAnimationFrame(animatePet)}
function heartbeat(){let now=new Date();$('clock').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(pet){updateTime();evolve();render()}}
heartbeat();if(!pet)welcome();animationFrame=requestAnimationFrame(animatePet);timer=setInterval(heartbeat,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)heartbeat()});
})();
</script></body></html>
