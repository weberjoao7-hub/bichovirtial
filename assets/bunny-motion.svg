</g></g><g class="fx happy-fx" fill="#ffdf63"><rect x="25" y="39" width="8" height="8"/><rect x="29" y="35" width="3" height="16"/><rect x="21" y="43" width="16" height="3"/><rect x="154" y="32" width="7" height="7"/></g><g class="fx sleep-fx" fill="#8d83bd"><path d="M149 33h21v5h-13l13 14v5h-22v-5h14l-13-14z"/><path d="M168 12h14v4h-8l8 9v4h-14v-4h8l-8-9z"/></g><g class="fx eat-fx"><path d="M64 153h60l-7 17H72z" fill="#e98d9e" stroke="#985773" stroke-width="4"/><rect x="80" y="150" width="10" height="6" fill="#a27645"/><rect x="96" y="147" width="10" height="9" fill="#9b6b40"/><rect x="111" y="150" width="9" height="6" fill="#a27645"/></g><g class="fx play-fx"><circle cx="151" cy="144" r="19" fill="#f7d76a" stroke="#896f4d" stroke-width="4"/><path d="M138 131l26 26m-1-27l-25 27" stroke="#83bca7" stroke-width="6"/></g><g class="fx wash-fx" fill="#b5f0ff" fill-opacity=".72" stroke="#68b4d2" stroke-width="3"><circle cx="34" cy="102" r="11"/><circle cx="158" cy="90" r="14"/><circle cx="154" cy="46" r="7"/><circle cx="40" cy="61" r="6"/></g><g class="fx heal-fx" fill="#e95f91"><path d="M142 37h7v-5h8v5h7v9h-6v6h-5v6h-5v-6h-6v-6h-6v-9z"/><rect x="27" y="59" width="8" height="8" fill="#8ed9b0"/></g></svg>