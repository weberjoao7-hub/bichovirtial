<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -38 190 218" width="190" height="218"><style>
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scale(1.015,.99)}}
@keyframes joy{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-4px) rotate(-3deg)}65%{transform:translateY(-2px) rotate(3deg)}}
@keyframes droop{0%,100%{transform:translateY(3px) scale(1,.96)}50%{transform:translateY(5px) scale(1.02,.94)}}
@keyframes rest{0%,100%{transform:translateY(2px) scale(1.01,.98)}50%{transform:translateY(4px) scale(1.03,.96)}}
@keyframes chew{0%,100%{transform:translateY(1px) scale(1,1)}50%{transform:translateY(4px) scale(1.06,.94)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-11px) rotate(-5deg)}70%{transform:translateY(-5px) rotate(5deg)}}
@keyframes scrub{0%,100%{transform:rotate(-3deg) translateX(-2px)}50%{transform:rotate(3deg) translateX(2px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05) translateY(-3px)}}
@keyframes stretch{0%,100%{transform:scale(1,1)}50%{transform:translateY(3px) scale(1.09,.92)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes floatfx{0%{transform:translateY(5px);opacity:.3}60%{opacity:1}100%{transform:translateY(-9px);opacity:.3}}
.sprite{transform-origin:90px 153px;animation:breathe 2.3s steps(4,end) infinite}
#happy:target~.sprite{animation:joy 1.15s steps(5,end) infinite}
#hungry:target~.sprite,#sick:target~.sprite{animation:droop 2.5s steps(4,end) infinite}
#sleep:target~.sprite{animation:rest 2.8s steps(4,end) infinite}
#eat:target~.sprite{animation:chew .4s steps(3,end) infinite}
#play:target~.sprite,#hop:target~.sprite{animation:bounce .72s steps(5,end) infinite}
#wash:target~.sprite{animation:scrub .42s steps(4,end) infinite}
#heal:target~.sprite{animation:pulse .9s steps(4,end) infinite}
#stretch:target~.sprite{animation:stretch 1s steps(4,end) infinite}
.fx{opacity:0;pointer-events:none;shape-rendering:crispEdges}
#happy:target~.happy-fx,#sleep:target~.sleep-fx,#eat:target~.eat-fx,#play:target~.play-fx,#wash:target~.wash-fx,#heal:target~.heal-fx{opacity:1}
#happy:target~.happy-fx,#heal:target~.heal-fx{animation:twinkle .9s steps(2,end) infinite}
#wash:target~.wash-fx,#sleep:target~.sleep-fx{animation:floatfx 1.7s steps(4,end) infinite}
@media(prefers-reduced-motion:reduce){.sprite,.fx{animation:none!important}}
@media(prefers-reduced-motion:reduce){.sprite{animation:none!important}.fx{animation:none!important}}
</style><g id="idle"/><g id="happy"/><g id="hungry"/><g id="sick"/><g id="sleep"/><g id="eat"/><g id="play"/><g id="wash"/><g id="heal"/><g id="hop"/><g id="stretch"/><g class="sprite"><image href="data:image/webp;base64," x="0" y="0" width="180" height="180" image-rendering="pixelated"/><g class="head-reconstruction" shape-rendering="crispEdges">
